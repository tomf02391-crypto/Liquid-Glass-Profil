<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbit-星轨引擎 — 超高胜率星轨集成引擎</title>
<style>
/* ================================================================
   Orbit-星轨引擎 — 苹果液态玻璃增强版 CSS
   多层玻璃 · 高光边缘 · 噪点纹理 · 光折射动画
   ================================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    /* 玻璃材质变量 */
    --glass-1: rgba(255, 255, 255, 0.07);
    --glass-2: rgba(255, 255, 255, 0.04);
    --glass-3: rgba(255, 255, 255, 0.10);
    --glass-hover: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-border-bright: rgba(255, 255, 255, 0.22);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.40), 0 2px 8px rgba(0, 0, 0, 0.20);
    --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.18), inset 0 -1px 1px rgba(0, 0, 0, 0.10);

    /* 文字层级 */
    --text-1: rgba(255, 255, 255, 0.96);
    --text-2: rgba(255, 255, 255, 0.62);
    --text-3: rgba(255, 255, 255, 0.40);
    --text-4: rgba(255, 255, 255, 0.25);

    /* 苹果系统色 */
    --blue: #0A84FF;
    --purple: #BF5AF2;
    --green: #30D158;
    --orange: #FF9F0A;
    --red: #FF453A;
    --cyan: #64D2FF;
    --pink: #FF375F;
    --indigo: #5E5CE6;
    --yellow: #FFD60A;
    --teal: #40C8E0;

    /* 模糊量 */
    --blur-lg: 40px;
    --blur-md: 24px;
    --blur-sm: 12px;

    /* 圆角 */
    --r-lg: 28px;
    --r-md: 20px;
    --r-sm: 14px;
    --r-xs: 10px;
}

html, body {
    width: 100%;
    min-height: 100vh;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text-1);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    background: #000000;
    position: relative;
}

/* ================================================================
   动态背景 — 多层光球 + 噪点
   ================================================================ */
.bg-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.30;
    will-change: transform;
}

.orb-1 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #0A84FF 0%, transparent 70%);
    top: -120px; left: -80px;
    animation: drift1 24s ease-in-out infinite;
}
.orb-2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #BF5AF2 0%, transparent 70%);
    bottom: -60px; right: -40px;
    animation: drift2 28s ease-in-out infinite;
}
.orb-3 {
    width: 360px; height: 360px;
    background: radial-gradient(circle, #30D158 0%, transparent 70%);
    top: 35%; left: 45%;
    animation: drift3 22s ease-in-out infinite;
}
.orb-4 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #FF9F0A 0%, transparent 70%);
    top: 60%; left: 10%;
    animation: drift1 30s ease-in-out infinite reverse;
    opacity: 0.20;
}

@keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(80px, -50px) scale(1.12); }
    66% { transform: translate(-50px, 70px) scale(0.88); }
}
@keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, -40px) scale(1.15); }
}
@keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-60px, 50px) scale(0.9); }
    66% { transform: translate(50px, -60px) scale(1.1); }
}

/* 噪点纹理叠加 */
.noise-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ================================================================
   主容器
   ================================================================ */
.app {
    position: relative;
    z-index: 2;
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 14px 48px;
}

/* ================================================================
   玻璃面板 — 核心液态玻璃效果
   ================================================================ */
.glass {
    background: var(--glass-1);
    backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--glass-shadow), var(--glass-inset);
    position: relative;
    overflow: hidden;
}

/* 顶部高光线 */
.glass::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
    z-index: 1;
}

/* 边缘光折射 */
.glass::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%);
    pointer-events: none;
    z-index: 1;
}

/* ================================================================
   标题栏
   ================================================================ */
.header {
    padding: 32px 28px 24px;
    text-align: center;
}

.header h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.8px;
    background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.55) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header .sub {
    font-size: 13px;
    color: var(--text-2);
    margin-top: 8px;
    letter-spacing: 0.6px;
}

.badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.badge {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    border: 1px solid;
}

.badge-blue {
    background: linear-gradient(135deg, rgba(10,132,255,0.15), rgba(10,132,255,0.05));
    border-color: rgba(10,132,255,0.3);
    color: var(--cyan);
}
.badge-purple {
    background: linear-gradient(135deg, rgba(191,90,242,0.15), rgba(191,90,242,0.05));
    border-color: rgba(191,90,242,0.3);
    color: var(--purple);
}
.badge-green {
    background: linear-gradient(135deg, rgba(48,209,88,0.15), rgba(48,209,88,0.05));
    border-color: rgba(48,209,88,0.3);
    color: var(--green);
}

/* ================================================================
   输入区
   ================================================================ */
.input-card {
    margin: 14px;
    padding: 22px;
}

.sec-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 2;
}

.sec-title::before {
    content: '';
    width: 3px; height: 16px;
    background: linear-gradient(180deg, var(--blue), var(--purple));
    border-radius: 2px;
    flex-shrink: 0;
}

textarea#input {
    width: 100%;
    min-height: 90px;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--r-md);
    color: var(--text-1);
    font-size: 14px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    backdrop-filter: blur(8px);
    position: relative;
    z-index: 2;
}

textarea#input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.12), inset 0 1px 2px rgba(0,0,0,0.2);
    background: rgba(0, 0, 0, 0.45);
}

textarea#input::placeholder {
    color: var(--text-4);
    line-height: 1.5;
}

/* 按钮组 */
.btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
}

.btn {
    flex: 1;
    min-width: 90px;
    padding: 13px 20px;
    border: none;
    border-radius: var(--r-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    font-family: inherit;
    letter-spacing: 0.3px;
}

/* 主按钮 — 液态玻璃蓝色 */
.btn-go {
    background: linear-gradient(135deg, #0A84FF 0%, #0066CC 100%);
    color: #fff;
    box-shadow: 0 4px 16px rgba(10, 132, 255, 0.35), inset 0 1px 1px rgba(255,255,255,0.25);
}
.btn-go::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    pointer-events: none;
}
.btn-go:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(10, 132, 255, 0.45), inset 0 1px 1px rgba(255,255,255,0.3);
}
.btn-go:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(10, 132, 255, 0.3);
}

/* 次按钮 — 玻璃质感 */
.btn-glass {
    background: var(--glass-3);
    color: var(--text-1);
    border: 1px solid var(--glass-border-bright);
    backdrop-filter: blur(var(--blur-sm));
    -webkit-backdrop-filter: blur(var(--blur-sm));
    box-shadow: 0 2px 8px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.12);
}
.btn-glass:hover {
    background: var(--glass-hover);
    transform: translateY(-1px);
}
.btn-glass:active {
    transform: translateY(0);
}

/* ================================================================
   结果展示区
   ================================================================ */
.result-card {
    margin: 14px;
    padding: 26px 22px;
    display: none;
    animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.result-card.show { display: block; }

@keyframes reveal {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 预测主卡片 */
.predict-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
}

.predict-box {
    padding: 22px 18px;
    border-radius: var(--r-md);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.predict-box.kill {
    background: linear-gradient(135deg, rgba(255, 69, 58, 0.14) 0%, rgba(255, 69, 58, 0.04) 100%);
    border: 1px solid rgba(255, 69, 58, 0.25);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.08);
}
.predict-box.kill::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,69,58,0.4), transparent);
}

.predict-box.rec {
    background: linear-gradient(135deg, rgba(48, 209, 88, 0.14) 0%, rgba(48, 209, 88, 0.04) 100%);
    border: 1px solid rgba(48, 209, 88, 0.25);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.08);
}
.predict-box.rec::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(48,209,88,0.4), transparent);
}

.p-label {
    font-size: 11px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 500;
}

.p-val {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -1.2px;
    line-height: 1.1;
}

.predict-box.kill .p-val { color: var(--red); }
.predict-box.rec .p-val { color: var(--green); }

.p-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 8px;
}

/* 分数芯片 */
.score-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 16px 0;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
}

.chip {
    padding: 9px 16px;
    border-radius: var(--r-xs);
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
}

.chip-rec {
    background: rgba(48, 209, 88, 0.10);
    color: var(--green);
    border: 1px solid rgba(48, 209, 88, 0.20);
}
.chip-kill {
    background: rgba(255, 69, 58, 0.10);
    color: var(--red);
    border: 1px solid rgba(255, 69, 58, 0.20);
}
.chip-rem {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-2);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

/* 置信度仪表 */
.conf-section {
    margin: 18px 0;
    position: relative;
    z-index: 2;
}

.conf-bar-bg {
    height: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
}

.conf-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    background: linear-gradient(90deg, var(--red) 0%, var(--orange) 40%, var(--green) 100%);
    box-shadow: 0 0 12px rgba(48, 209, 88, 0.3);
    position: relative;
}
.conf-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
    border-radius: 5px 5px 0 0;
}

.conf-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-2);
}

.conf-val {
    font-weight: 700;
    font-size: 22px;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
}

/* 分隔线 */
.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin: 18px 0;
    position: relative;
    z-index: 2;
}

/* 星轨模式检测 */
.regime-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    position: relative;
    z-index: 2;
}

.regime-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid;
}

.r-chaos { background: rgba(100,210,255,0.10); color: var(--cyan); border-color: rgba(100,210,255,0.25); }
.r-orbit { background: rgba(10,132,255,0.10); color: var(--blue); border-color: rgba(10,132,255,0.25); }
.r-gravity { background: rgba(191,90,242,0.10); color: var(--purple); border-color: rgba(191,90,242,0.25); }
.r-pulsar { background: rgba(255,159,10,0.10); color: var(--orange); border-color: rgba(255,159,10,0.25); }
.r-galaxy { background: rgba(94,92,230,0.10); color: var(--indigo); border-color: rgba(94,92,230,0.25); }

.regime-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.35); }
}

/* 信息行 */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    position: relative;
    z-index: 2;
}

.info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--r-xs);
    border: 1px solid rgba(255,255,255,0.04);
}

.info-k { font-size: 12px; color: var(--text-2); }
.info-v {
    font-weight: 600;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--text-1);
}

/* 因子权重可视化 */
.factors-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 14px;
    position: relative;
    z-index: 2;
}

.factor-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--r-xs);
    border: 1px solid rgba(255,255,255,0.05);
    transition: background 0.3s;
}
.factor-item:hover { background: rgba(255,255,255,0.06); }

.f-name {
    font-size: 12px;
    color: var(--text-2);
    min-width: 56px;
    flex-shrink: 0;
}

.f-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.2);
}

.f-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 6px currentColor;
}

.f-pct {
    font-size: 11px;
    color: var(--text-3);
    min-width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

.f-hr {
    font-size: 10px;
    color: var(--text-4);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

/* 策略表现 */
.strat-list {
    margin-top: 12px;
    position: relative;
    z-index: 2;
}

.strat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-radius: var(--r-xs);
    margin-bottom: 6px;
    font-size: 13px;
    transition: all 0.3s;
    border: 1px solid transparent;
}

.strat-row:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.06);
}
.strat-row.best {
    background: rgba(48, 209, 88, 0.08);
    border-color: rgba(48, 209, 88, 0.15);
}

.strat-name { color: var(--text-2); }
.strat-rate {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
}
.strat-row.best .strat-rate { color: var(--green); }

.strat-bar {
    width: 60px;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 8px;
}
.strat-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
}

/* 星系投票可视化 */
.ensemble-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 12px;
    position: relative;
    z-index: 2;
}

.ens-item {
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--r-xs);
    border: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.ens-name {
    font-size: 12px;
    color: var(--text-2);
}

.ens-vote {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
}

.ens-vote.kill { background: rgba(255,69,58,0.15); color: var(--red); }
.ens-vote.keep { background: rgba(48,209,88,0.10); color: var(--green); }

/* 加载动画 */
.loader {
    display: none;
    text-align: center;
    padding: 40px;
    position: relative;
    z-index: 2;
}
.loader.show { display: block; }

.spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--blue);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loader-text {
    font-size: 13px;
    color: var(--text-2);
}

/* ================================================================

<script>
// ============================================================
// Orbit-星轨引擎 — 超高胜率星轨集成引擎
// 12星轨因子 · 星轨元学习 · 自适应策略选择 · 置信度门控
// ============================================================

const COMBOS = ['小单', '小双', '大单', '大双'];

function comboOf(nums) {
    const total = nums.reduce((a, b) => a + b, 0);
    const size = total <= 13 ? '小' : '大';
    const parity = total % 2 === 1 ? '单' : '双';
    return size + parity;
}

function parseHistory(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    const history = [];
    for (const line of lines) {
        const nums = line.trim().split(/[\s,，]+/).map(Number).filter(n => !isNaN(n) && n >= 0 && n <= 9);
        if (nums.length >= 3) {
            history.push({
                nums: nums.slice(0, 3),
                sum: nums.slice(0, 3).reduce((a, b) => a + b, 0),
                combo: comboOf(nums.slice(0, 3))
            });
        }
    }
    return history;
}

// ============================================================
// 因子构建引擎 — 12星轨因子
// ============================================================
function buildFactors(history) {
    if (!history || history.length < 10) return null;
    const n = history.length;
    const lastCombo = history[n - 1].combo;
    const ch = history.map(d => d.combo);
    const sums = history.map(d => d.sum);
    const r10 = history.slice(-10);
    const r20 = history.slice(-20);
    const r30 = history.slice(-30);
    const r50 = history.slice(-50);

    // --- 星轨因子1: 星云多窗口贝叶斯频率 ---
    const f10 = {}, f20 = {}, f30 = {}, f50 = {};
    COMBOS.forEach(c => { f10[c] = 0; f20[c] = 0; f30[c] = 0; f50[c] = 0; });
    r10.forEach(d => { if (f10[d.combo] !== undefined) f10[d.combo]++; });
    r20.forEach(d => { if (f20[d.combo] !== undefined) f20[d.combo]++; });
    r30.forEach(d => { if (f30[d.combo] !== undefined) f30[d.combo]++; });
    r50.forEach(d => { if (f50[d.combo] !== undefined) f50[d.combo]++; });
    const F_nebula = (c) =>
        ((f10[c] + 1) / 14) * 0.4 +
        ((f20[c] + 1) / 24) * 0.3 +
        ((f30[c] + 1) / 34) * 0.2 +
        ((f50[c] + 1) / 54) * 0.1;

    // --- 星轨因子2: 轨道转移链（近期衰减加权） ---
    const decay = 0.94;
    const t1 = {}, t2 = {}, t3 = {}, t4 = {};
    for (let i = 0; i < n - 1; i++) {
        const w = Math.pow(decay, n - 2 - i);
        if (!t1[ch[i]]) t1[ch[i]] = {};
        t1[ch[i]][ch[i + 1]] = (t1[ch[i]][ch[i + 1]] || 0) + w;
    }
    for (let i = 0; i < n - 2; i++) {
        const w = Math.pow(decay, n - 3 - i);
        const k = ch[i] + ',' + ch[i + 1];
        if (!t2[k]) t2[k] = {};
        t2[k][ch[i + 2]] = (t2[k][ch[i + 2]] || 0) + w;
    }
    for (let i = 0; i < n - 3; i++) {
        const w = Math.pow(decay, n - 4 - i);
        const k = ch[i] + ',' + ch[i + 1] + ',' + ch[i + 2];
        if (!t3[k]) t3[k] = {};
        t3[k][ch[i + 3]] = (t3[k][ch[i + 3]] || 0) + w;
    }
    for (let i = 0; i < n - 4; i++) {
        const w = Math.pow(decay, n - 5 - i);
        const k = ch[i] + ',' + ch[i + 1] + ',' + ch[i + 2] + ',' + ch[i + 3];
        if (!t4[k]) t4[k] = {};
        t4[k][ch[i + 4]] = (t4[k][ch[i + 4]] || 0) + w;
    }
    const prev1 = ch[n - 2] || lastCombo;
    const prev2 = ch[n - 3] || prev1;
    const prev3 = ch[n - 4] || prev2;
    const mk2 = prev1 + ',' + lastCombo;
    const mk3 = prev2 + ',' + prev1 + ',' + lastCombo;
    const mk4 = prev3 + ',' + prev2 + ',' + prev1 + ',' + lastCombo;
    const t1T = t1[lastCombo] ? Object.values(t1[lastCombo]).reduce((a, b) => a + b, 0) : 0;
    const t2T = t2[mk2] ? Object.values(t2[mk2]).reduce((a, b) => a + b, 0) : 0;
    const t3T = t3[mk3] ? Object.values(t3[mk3]).reduce((a, b) => a + b, 0) : 0;
    const t4T = t4[mk4] ? Object.values(t4[mk4]).reduce((a, b) => a + b, 0) : 0;

    const F_orbit = (c) => {
        const v1 = t1T > 0 ? ((t1[lastCombo][c] || 0) + 0.5) / (t1T + 2) : 0.25;
        const v2 = t2T > 0 ? ((t2[mk2][c] || 0) + 0.5) / (t2T + 2) : 0.25;
        const v3 = t3T > 0 ? ((t3[mk3][c] || 0) + 0.5) / (t3T + 2) : 0.25;
        const v4 = t4T > 0 ? ((t4[mk4][c] || 0) + 0.5) / (t4T + 2) : 0.25;
        const w1 = 0.40, w2 = t2T >= 3 ? 0.30 : 0.25, w3 = t3T >= 3 ? 0.20 : 0.0, w4 = t4T >= 3 ? 0.10 : 0.0;
        const ws = w1 + w2 + w3 + w4;
        return (v1 * w1 + v2 * w2 + v3 * w3 + v4 * w4) / ws;
    };

    // --- 星轨因子3: 日蚀指数回归 ---
    const miss = {}, avgGap = {};
    COMBOS.forEach(c => {
        let idx = n - 1;
        while (idx >= 0 && ch[idx] !== c) idx--;
        miss[c] = n - 1 - idx;
        const gaps = [];
        let ls = -1;
        for (let i = 0; i < n; i++) {
            if (ch[i] === c) { if (ls >= 0) gaps.push(i - ls); ls = i; }
        }
        avgGap[c] = gaps.length > 0 ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 4;
    });
    const F_eclipse = (c) => {
        const ratio = miss[c] / (avgGap[c] || 1);
        return 0.25 + (1 - Math.exp(-ratio * 0.8)) * 0.5;
    };

    // --- 星轨因子4: 彗星动量 (RSI增强) ---
    const a10 = r10.reduce((s, d) => s + d.sum, 0) / Math.min(10, r10.length);
    const a20 = r20.length > 0 ? r20.reduce((s, d) => s + d.sum, 0) / r20.length : a10;
    const td = a10 - a20;
    let bm = 0;
    for (let i = n - 10; i < n; i++) { if (i >= 0 && ch[i].startsWith('大')) bm++; }
    const F_comet = (c) => {
        const ib = c.startsWith('大'), io = c.endsWith('单');
        let s = 0.25;
        if (td > 1) s = ib ? 0.35 : 0.15;
        else if (td < -1) s = ib ? 0.15 : 0.35;
        if (bm > 7) s = ib ? s * 1.4 : s * 0.6;
        else if (bm < 3) s = ib ? s * 0.6 : s * 1.4;
        if (n >= 3 && sums[n-1] > sums[n-2] && sums[n-2] > sums[n-3]) s = ib ? s * 1.25 : s * 0.75;
        else if (n >= 3 && sums[n-1] < sums[n-2] && sums[n-2] < sums[n-3]) s = ib ? s * 0.75 : s * 1.25;
        const or10 = r10.filter(d => Math.abs(d.sum) % 2 === 1).length / Math.min(10, r10.length);
        if (or10 > 0.6) s = io ? s * 0.8 : s * 1.2;
        else if (or10 < 0.4) s = io ? s * 1.2 : s * 0.8;
        return Math.max(0.05, Math.min(0.55, s));
    };

    // --- 星轨因子5: 虚空抑制 ---
    let rc = 0, tt = 0;
    for (let i = 1; i < n; i++) { tt++; if (ch[i] === ch[i - 1]) rc++; }
    const rr = tt > 0 ? rc / tt : 0.25;
    const F_void = (c) => {
        let st = 0;
        for (let i = n - 1; i >= 0 && ch[i] === c; i--) st++;
        return Math.max(0.05, 0.25 - st * 0.08 * Math.max(0.5, 0.25 / Math.max(0.05, rr)));
    };

    // --- 星轨因子6: 星座变长模式匹配 (2-7) ---
    const F_constellation = (c) => {
        let ts = 0, tw = 0;
        for (let plen = 2; plen <= 7; plen++) {
            if (n < plen + 1) continue;
            const pat = ch.slice(-plen).join(',');
            const matches = [];
            for (let i = 0; i <= n - plen - 1; i++) {
                if (ch.slice(i, i + plen).join(',') === pat) matches.push(ch[i + plen]);
            }
            if (matches.length > 0) {
                const hr = matches.filter(s => s === c).length / matches.length;
                const w = matches.length >= 2 ? plen * matches.length : 0;
                ts += hr * w; tw += w;
            }
        }
        return tw > 0 ? ts / tw : 0.25;
    };

    // --- 星轨因子7: 脉冲星周期分析 ---
    const F_pulsar = (c) => {
        const pos = [];
        for (let i = 0; i < n; i++) { if (ch[i] === c) pos.push(i); }
        if (pos.length < 3) return 0.25;
        const intervals = [];
        for (let i = 1; i < pos.length; i++) intervals.push(pos[i] - pos[i - 1]);
        const ag = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        if (ag === 0) return 0.25;
        const v = intervals.reduce((a, b) => a + (b - ag) * (b - ag), 0) / intervals.length;
        const cv = Math.sqrt(v) / ag;
        const exp = pos[pos.length - 1] + ag;
        const d = Math.abs(n - exp);
        return 0.25 + Math.max(0, 1 - cv) * Math.max(0, 1 - d / ag) * 0.4;
    };

    // --- 星轨因子8: 类星体信息熵 ---
    const f30m = {};
    COMBOS.forEach(c => f30m[c] = 0);
    r30.forEach(d => { if (f30m[d.combo] !== undefined) f30m[d.combo]++; });
    let entropy = 0;
    COMBOS.forEach(c => { const p = f30m[c] / Math.min(30, r30.length); if (p > 0) entropy -= p * Math.log2(p); });
    const predictability = 1 - entropy / 2.0;
    const F_quasar = (c) => 0.25 + ((f30m[c] + 1) / (Math.min(30, r30.length) + 4) - 0.25) * predictability * 1.5;

    // --- 星轨因子9: 引力场-组合条件概率 ---
    const srCur = sums[n-1] >= 18 ? 'high' : (sums[n-1] >= 10 ? 'mid' : 'low');
    const cc = {};
    for (let i = 0; i < n; i++) {
        const sr = sums[i] >= 18 ? 'high' : (sums[i] >= 10 ? 'mid' : 'low');
        if (!cc[sr]) cc[sr] = {};
        cc[sr][ch[i]] = (cc[sr][ch[i]] || 0) + 1;
    }
    const F_gravity = (c) => {
        if (cc[srCur]) {
            const total = Object.values(cc[srCur]).reduce((a, b) => a + b, 0);
            return ((cc[srCur][c] || 0) + 0.5) / (total + 2);
        }
        return 0.25;
    };

    // --- 星轨因子10: 漂移偏置 ---
    const globalTrans = {};
    COMBOS.forEach(c => { globalTrans[c] = {}; COMBOS.forEach(c2 => globalTrans[c][c2] = 0); });
    for (let i = 0; i < n - 1; i++) globalTrans[ch[i]][ch[i + 1]]++;
    const F_drift = (c) => {
        if (t1T > 0) {
            const total = Object.values(globalTrans[lastCombo]).reduce((a, b) => a + b, 0);
            if (total > 0) return (globalTrans[lastCombo][c] + 0.5) / (total + 2);
        }
        return 0.25;
    };

    // --- 星轨因子11: 极光自适应窗口频率 ---
    // 根据近期数据动态选择最佳窗口大小
    const F_aurora = (c) => {
        let bestScore = 0, bestWeight = 0;
        for (const win of [5, 8, 12, 15, 20, 30]) {
            const slice = history.slice(-win);
            const freq = {};
            COMBOS.forEach(cc => freq[cc] = 0);
            slice.forEach(d => { if (freq[d.combo] !== undefined) freq[d.combo]++; });
            // 计算这个窗口的预测力（频率偏离均匀的程度）
            const deviation = COMBOS.reduce((s, cc) => s + Math.abs(freq[cc] / win - 0.25), 0);
            const score = (freq[c] + 1) / (win + 4);
            bestScore += score * deviation;
            bestWeight += deviation;
        }
        return bestWeight > 0 ? bestScore / bestWeight : 0.25;
    };

    // --- 星轨因子12: 流星加权邻近模式 ---
    // 给近期匹配更高的权重
    const F_meteor = (c) => {
        let ts = 0, tw = 0;
        for (let plen = 2; plen <= 5; plen++) {
            if (n < plen + 1) continue;
            const pat = ch.slice(-plen).join(',');
            for (let i = 0; i <= n - plen - 1; i++) {
                if (ch.slice(i, i + plen).join(',') === pat) {
                    const recencyWeight = (i + plen) / n; // 越近权重越高
                    const target = ch[i + plen];
                    if (target === c) ts += recencyWeight;
                    tw += recencyWeight;
                }
            }
        }
        return tw > 0 ? ts / tw : 0.25;
    };

    return {
        nebula: F_nebula, orbit: F_orbit, eclipse: F_eclipse, comet: F_comet,
        void: F_void, constellation: F_constellation, pulsar: F_pulsar,
        quasar: F_quasar, gravity: F_gravity, drift: F_drift,
        aurora: F_aurora, meteor: F_meteor
    };
}

// ============================================================
// 单星轨因子回测 — Walk-Forward 验证
// ============================================================
function backtestFactor(fname, history, window) {
    const n = history.length;
    const btWin = Math.min(window, n - 5);
    let hits = 0, total = 0;
    for (let i = 0; i < btWin; i++) {
        const endIdx = n - btWin + i;
        if (endIdx < 15) continue;
        const testFns = buildFactors(history.slice(0, endIdx));
        if (!testFns || !testFns[fname]) continue;
        let worst = COMBOS[0], worstVal = Infinity;
        COMBOS.forEach(c => {
            const v = testFns[fname](c);
            if (v < worstVal) { worstVal = v; worst = c; }
        });
        if (worst !== history[endIdx].combo) hits++;
        total++;
    }
    return total > 0 ? hits / total : 0.75;
}

// ============================================================
// 星轨模式检测
// ============================================================
function detectRegime(history) {
    const n = history.length;
    const ch = history.map(d => d.combo);

    // 引力偏移检测
    const freq = {};
    COMBOS.forEach(c => freq[c] = 0);
    ch.forEach(c => freq[c]++);
    const freqVals = Object.values(freq);
    const avgFreq = n / 4;
    const freqStd = Math.sqrt(freqVals.reduce((a, b) => a + (b - avgFreq) ** 2, 0) / 4);
    const freqCV = avgFreq > 0 ? freqStd / avgFreq : 0;

    // 轨道偏移检测
    const t1 = {};
    COMBOS.forEach(c => { t1[c] = {}; COMBOS.forEach(c2 => t1[c][c2] = 0); });
    for (let i = 0; i < n - 1; i++) t1[ch[i]][ch[i + 1]]++;
    let orbitDev = 0, orbitCount = 0;
    COMBOS.forEach(from => {
        const total = Object.values(t1[from]).reduce((a, b) => a + b, 0);
        if (total > 0) {
            COMBOS.forEach(to => {
                orbitDev += Math.abs(t1[from][to] / total - 0.25);
                orbitCount++;
            });
        }
    });
    const orbitScore = orbitCount > 0 ? orbitDev / orbitCount : 0;

    // 周期性
    let periodicScore = 0;
    let periodicCount = 0;
    COMBOS.forEach(c => {
        const pos = [];
        for (let i = 0; i < n; i++) { if (ch[i] === c) pos.push(i); }
        if (pos.length >= 3) {
            const intervals = [];
            for (let i = 1; i < pos.length; i++) intervals.push(pos[i] - pos[i - 1]);
            const ag = intervals.reduce((a, b) => a + b, 0) / intervals.length;
            if (ag > 0) {
                const v = intervals.reduce((a, b) => a + (b - ag) ** 2, 0) / intervals.length;
                const cv = Math.sqrt(v) / ag;
                periodicScore += Math.max(0, 1 - cv);
                periodicCount++;
            }
        }
    });
    periodicScore = periodicCount > 0 ? periodicScore / periodicCount : 0;

    // 综合判断
    const signals = [];
    if (periodicScore > 0.5) signals.push('pulsar');
    if (freqCV > 0.3) signals.push('gravity');
    if (orbitScore > 0.15) signals.push('orbit');
    if (signals.length === 0) return { regime: 'chaos', label: '深空混沌', score: 0, signals };
    if (signals.length > 1) return { regime: 'galaxy', label: '混沌星系', score: 0.5, signals };

    if (signals[0] === 'pulsar') return { regime: 'pulsar', label: '脉冲节律', score: periodicScore, signals };
    if (signals[0] === 'gravity') return { regime: 'gravity', label: '引力偏移', score: freqCV, signals };
    return { regime: 'orbit', label: '轨道锁定', score: orbitScore, signals };
}

// ============================================================
// 策略1: 引力场杀组
// ============================================================
function strategyGravity(history, fns, dynW) {
    const fnames = Object.keys(fns);
    const rawScores = {};
    COMBOS.forEach(c => {
        rawScores[c] = fnames.reduce((s, f) => s + fns[f](c) * dynW[f], 0);
    });
    const sorted = COMBOS.slice().sort((a, b) => rawScores[a] - rawScores[b]);
    return { kill: sorted[0], scores: rawScores };
}

// ============================================================
// 策略2: 星系投票杀组
// ============================================================
function strategyGalaxy(history, fns, dynW) {
    const killVotes = {};
    COMBOS.forEach(c => killVotes[c] = 0);
    Object.keys(fns).forEach(f => {
        let worst = COMBOS[0], wv = Infinity;
        COMBOS.forEach(c => { const v = fns[f](c); if (v < wv) { wv = v; worst = c; } });
        killVotes[worst] += dynW[f];
    });
    return { kill: COMBOS.slice().sort((a, b) => killVotes[b] - killVotes[a])[0], votes: killVotes };
}

// ============================================================
// 策略3: 超新星杀组
// ============================================================
function strategyNova(history) {
    const r10 = history.slice(-10);
    const freq = {};
    COMBOS.forEach(c => freq[c] = 0);
    r10.forEach(d => { if (freq[d.combo] !== undefined) freq[d.combo]++; });
    return { kill: COMBOS.slice().sort((a, b) => freq[b] - freq[a])[0], freq };
}

// ============================================================
// 策略4: 暗物质杀组
// ============================================================
function strategyDarkMatter(history) {
    const r30 = history.slice(-30);
    const freq = {};
    COMBOS.forEach(c => freq[c] = 0);
    r30.forEach(d => { if (freq[d.combo] !== undefined) freq[d.combo]++; });
    return { kill: COMBOS.slice().sort((a, b) => freq[a] - freq[b])[0], freq };
}

// ============================================================
// 策略5: 轨道路径杀组 (独立策略)
// ============================================================
function strategyOrbitPath(history) {
    const fns = buildFactors(history);
    if (!fns) return { kill: COMBOS[0] };
    const scores = {};
    COMBOS.forEach(c => { scores[c] = fns.orbit(c); });
    return { kill: COMBOS.slice().sort((a, b) => scores[a] - scores[b])[0], scores };
}

// ============================================================
// 策略6: 星座图谱杀组 (独立策略)
// ============================================================
function strategyStarMap(history) {
    const fns = buildFactors(history);
    if (!fns) return { kill: COMBOS[0] };
    const scores = {};
    COMBOS.forEach(c => { scores[c] = fns.constellation(c) + fns.meteor(c); });
    return { kill: COMBOS.slice().sort((a, b) => scores[a] - scores[b])[0], scores };
}

// ============================================================
// 策略7: 日蚀回归杀组 (独立策略)
// ============================================================
function strategyEclipseReturn(history) {
    const fns = buildFactors(history);
    if (!fns) return { kill: COMBOS[0] };
    const scores = {};
    COMBOS.forEach(c => { scores[c] = fns.eclipse(c); });
    return { kill: COMBOS.slice().sort((a, b) => scores[a] - scores[b])[0], scores };
}

// ============================================================
// 回测单个策略
// ============================================================
function backtestStrategy(stratName, history, window) {
    const n = history.length;
    const btWin = Math.min(window, n - 5);
    let hits = 0, total = 0;
    for (let i = 0; i < btWin; i++) {
        const endIdx = n - btWin + i;
        if (endIdx < 15) continue;
        const th = history.slice(0, endIdx);
        let kill = COMBOS[0];
        if (stratName === '超新星') {
            const r = strategyNova(th);
            kill = r.kill;
        } else if (stratName === '暗物质') {
            const r = strategyDarkMatter(th);
            kill = r.kill;
        } else if (stratName === '轨道路径') {
            const r = strategyOrbitPath(th);
            kill = r.kill;
        } else if (stratName === '星座图谱') {
            const r = strategyStarMap(th);
            kill = r.kill;
        } else if (stratName === '日蚀回归') {
            const r = strategyEclipseReturn(th);
            kill = r.kill;
        } else if (stratName === '引力场' || stratName === '星系投票') {
            const testFns = buildFactors(th);
            if (!testFns) continue;
            const fnames = Object.keys(testFns);
            const baseW = {};
            fnames.forEach(f => baseW[f] = 1 / fnames.length);
            if (stratName === '引力场') {
                const r = strategyGravity(th, testFns, baseW);
                kill = r.kill;
            } else {
                const r = strategyGalaxy(th, testFns, baseW);
                kill = r.kill;
            }
        }
        if (kill !== history[endIdx].combo) hits++;
        total++;
    }
    return total > 0 ? hits / total : 0.75;
}

// ============================================================
// 主预测函数 — 星轨元学习
// ============================================================
function predict(history) {
    if (!history || history.length < 15) {
        return { error: '数据不足，至少需要15期历史数据' };
    }

    const n = history.length;
    const ch = history.map(d => d.combo);
    const sums = history.map(d => d.sum);
    const r10 = history.slice(-10);
    const r30 = history.slice(-30);

    // 构建因子
    const fns = buildFactors(history);
    if (!fns) return { error: '因子构建失败' };

    const fnames = Object.keys(fns);
    const baseW = {
        nebula: 0.08, orbit: 0.18, eclipse: 0.10, comet: 0.06,
        void: 0.08, constellation: 0.12, pulsar: 0.06,
        quasar: 0.05, gravity: 0.07, drift: 0.05,
        aurora: 0.08, meteor: 0.07
    };

    // 因子回测 — 多窗口加权
    const factorHitRates = {};
    fnames.forEach(f => {
        const r20 = backtestFactor(f, history, 15);
        const r30b = backtestFactor(f, history, 25);
        factorHitRates[f] = r20 * 0.6 + r30b * 0.4;
    });

    // 贝叶斯式动态权重
    const dynW = {};
    fnames.forEach(f => {
        const hr = factorHitRates[f];
        const pr = Math.max(0.35, Math.min(2.2, hr / 0.75));
        dynW[f] = baseW[f] * pr;
    });
    const wSum = Object.values(dynW).reduce((a, b) => a + b, 0);
    fnames.forEach(f => dynW[f] /= wSum);

    // === 运行所有策略 ===
    const strategies = {};

    // 策略1: 引力场
    const scoreResult = strategyGravity(history, fns, dynW);
    strategies['引力场'] = { kill: scoreResult.kill, scores: scoreResult.scores };

    // 策略2: 星系投票
    const voteResult = strategyGalaxy(history, fns, dynW);
    strategies['星系投票'] = { kill: voteResult.kill, votes: voteResult.votes };

    // 策略3: 超新星杀组
    const hotResult = strategyNova(history);
    strategies['超新星'] = { kill: hotResult.kill };

    // 策略4: 暗物质杀组
    const coldResult = strategyDarkMatter(history);
    strategies['暗物质'] = { kill: coldResult.kill };

    // 策略5: 马尔可夫
    const markovResult = strategyOrbitPath(history);
    strategies['轨道路径'] = { kill: markovResult.kill };

    // 策略6: 模式匹配
    const patternResult = strategyStarMap(history);
    strategies['星座图谱'] = { kill: patternResult.kill };

    // 策略7: 遗漏回归
    const missResult = strategyEclipseReturn(history);
    strategies['日蚀回归'] = { kill: missResult.kill };

    // === 回测各星轨策略近期表现 ===
    const stratPerf = {};
    for (const name of Object.keys(strategies)) {
        stratPerf[name] = backtestStrategy(name, history, 20);
    }

    // === 星系投票 ===
    // 根据星轨策略近期表现加权投票
    const ensembleVotes = {};
    COMBOS.forEach(c => ensembleVotes[c] = 0);
    let totalWeight = 0;

    for (const [name, info] of Object.entries(strategies)) {
        const perf = stratPerf[name];
        // 权重 = 近期表现^2 (表现好的策略权重更高)
        const weight = Math.pow(Math.max(0.5, perf), 2.5);
        ensembleVotes[info.kill] += weight;
        totalWeight += weight;
    }

    // 归一化
    COMBOS.forEach(c => ensembleVotes[c] /= totalWeight);

    // === 最终杀组决策 ===
    let def = COMBOS.slice().sort((a, b) => ensembleVotes[b] - ensembleVotes[a])[0];

    // 引力场辅助验证
    const sortedScores = COMBOS.slice().sort((a, b) => scoreResult.scores[a] - scoreResult.scores[b]);
    const scoreWorst = sortedScores[0];

    // 如果星系投票和引力场一致，增加置信度
    let extraConfidence = 0;
    if (def === scoreWorst) extraConfidence += 5;

    // 超新星覆盖检测
    const hotFreq = {};
    COMBOS.forEach(c => hotFreq[c] = 0);
    r10.forEach(d => { if (hotFreq[d.combo] !== undefined) hotFreq[d.combo]++; });
    const hotCombo = COMBOS.slice().sort((a, b) => hotFreq[b] - hotFreq[a])[0];

    if (hotFreq[hotCombo] >= 4 && hotCombo !== def) {
        let hotHits = 0, hotTotal = 0;
        for (let i = 0; i < Math.min(10, n - 15); i++) {
            const endIdx = n - 10 + i;
            if (endIdx < 15) continue;
            const tr = history.slice(endIdx - 10, endIdx);
            const tf = {};
            COMBOS.forEach(c => tf[c] = 0);
            tr.forEach(d => { if (tf[d.combo] !== undefined) tf[d.combo]++; });
            const th = COMBOS.slice().sort((a, b) => tf[b] - tf[a])[0];
            if (tf[th] >= 4) {
                if (th !== history[endIdx].combo) hotHits++;
                hotTotal++;
            }
        }
        if (hotTotal > 0 && hotHits / hotTotal > 0.82) {
            def = hotCombo;
            extraConfidence += 3;
        }
    }

    // 安全网：当整体表现差时，回退到最稳健策略
    const avgHR = Object.values(stratPerf).reduce((a, b) => a + b, 0) / Object.keys(stratPerf).length;
    if (avgHR < 0.72) {
        // 找近期表现最好的策略
        const bestStrat = Object.entries(stratPerf).sort((a, b) => b[1] - a[1])[0];
        if (bestStrat[1] > avgHR + 0.05) {
            def = strategies[bestStrat[0]].kill;
        }
    }

    // === 推荐组合 ===
    const sortedByScore = COMBOS.filter(c => c !== def).sort((a, b) => scoreResult.scores[b] - scoreResult.scores[a]);
    const rec1 = sortedByScore[0];
    const rec2 = sortedByScore[1];
    const remaining = sortedByScore[2];

    // === 星轨模式检测 ===
    const regime = detectRegime(history);

    // === 和值预测 ===
    const predSum = Math.round(sums.slice(-10).reduce((a, b) => a + b, 0) / Math.min(10, r10.length));
    const lastNums = history[n - 1].nums;
    const groupBase = (predSum + lastNums[0] * 3 + lastNums[2] * 7) % 28;
    const groupNum = String(groupBase).padStart(2, '0');

    // === 置信度计算 ===
    const scoreSpread = scoreResult.scores[rec1] - scoreResult.scores[def];
    const consensusRate = Object.values(strategies).filter(s => s.kill === def).length / Object.keys(strategies).length;
    const topVoteShare = ensembleVotes[def];
    const predictability = 1 - (function() {
        const f30m = {};
        COMBOS.forEach(c => f30m[c] = 0);
        r30.forEach(d => { if (f30m[d.combo] !== undefined) f30m[d.combo]++; });
        let e = 0;
        COMBOS.forEach(c => { const p = f30m[c] / Math.min(30, r30.length); if (p > 0) e -= p * Math.log2(p); });
        return e / 2.0;
    })();

    const confidence = Math.min(99, Math.round(
        Math.min(1, scoreSpread / 0.12) * 25 +
        consensusRate * 30 +
        avgHR * 20 +
        predictability * 10 +
        topVoteShare * 10 +
        extraConfidence
    ));

    // === 分数缩放 ===
    const allScores = [scoreResult.scores[rec1], scoreResult.scores[rec2], scoreResult.scores[def], scoreResult.scores[remaining]];
    const minS = Math.min(...allScores), maxS = Math.max(...allScores);
    const range = maxS - minS || 1;
    const scaleScore = (s) => Math.round(9 + ((s - minS) / range) * 12);

    // === 星系一致性 ===
    const consensusCount = Object.values(strategies).filter(s => s.kill === def).length;
    const consensusPct = Math.round(consensusCount / Object.keys(strategies).length * 100);

    return {
        killGroup: def,
        rec1, rec2, remaining,
        scores: `${String(scaleScore(scoreResult.scores[rec1])).padStart(2,'0')}/${String(scaleScore(scoreResult.scores[rec2])).padStart(2,'0')}/${String(scaleScore(scoreResult.scores[def])).padStart(2,'0')}/${String(scaleScore(scoreResult.scores[remaining])).padStart(2,'0')}`,
        confidence,
        dataCount: n,
        predSum,
        groupNum,
        regime,
        factorHitRates,
        dynWeights: dynW,
        rawScores: scoreResult.scores,
        stratPerf,
        avgHitRate: avgHR,
        bestStrat: Object.entries(stratPerf).sort((a, b) => b[1] - a[1])[0][0],
        ensembleVotes,
        strategies,
        consensusPct,
        predictability
    };
}

// ============================================================
// UI 交互逻辑
// ============================================================
function runPredict() {
    const text = document.getElementById('input').value;
    const history = parseHistory(text);
    if (history.length < 15) {
        alert('至少需要15期历史数据，当前仅 ' + history.length + ' 期');
        return;
    }

    // 显示加载动画
    const loaderCard = document.getElementById('loaderCard');
    const resultCard = document.getElementById('resultCard');
    resultCard.classList.remove('show');
    loaderCard.style.display = 'block';

    // 异步执行给UI渲染时间
    setTimeout(() => {
        const result = predict(history);
        loaderCard.style.display = 'none';

        if (result.error) {
            alert(result.error);
            return;
        }

        displayResult(result, history);
    }, 50);
}

function displayResult(result, history) {
    const section = document.getElementById('resultCard');
    section.classList.add('show');

    // 杀组
    document.getElementById('killGroup').textContent = result.killGroup;
    document.getElementById('killSub').textContent = `置信度 ${result.confidence}% · 星系投票 ${(result.ensembleVotes[result.killGroup] * 100).toFixed(0)}%`;

    // 推荐
    document.getElementById('recCombos').textContent = result.rec1 + ' ' + result.rec2;
    document.getElementById('recSub').textContent = `主推 ${result.rec1} · 次推 ${result.rec2}`;

    // 分数
    const sd = document.getElementById('scoreRow');
    const parts = result.scores.split('/');
    sd.innerHTML = `
        <div class="chip chip-rec">${result.rec1} ${parts[0]}</div>
        <div class="chip chip-rec">${result.rec2} ${parts[1]}</div>
        <div class="chip chip-kill">${result.killGroup} ${parts[2]}</div>
        <div class="chip chip-rem">${result.remaining} ${parts[3]}</div>
    `;

    // 置信度
    setTimeout(() => {
        document.getElementById('confBar').style.width = result.confidence + '%';
    }, 150);
    document.getElementById('confVal').textContent = result.confidence + '%';

    // 基本信息
    document.getElementById('dataCount').textContent = result.dataCount + ' 期';
    document.getElementById('sumPred').textContent = result.predSum;
    document.getElementById('groupNum').textContent = result.groupNum;
    document.getElementById('bestStrat').textContent = result.bestStrat;
    document.getElementById('btRate').textContent = (result.avgHitRate * 100).toFixed(1) + '%';
    document.getElementById('consensus').textContent = result.consensusPct + '%';

    // 星轨模式检测
    const rb = document.getElementById('regimeBadge');
    const rCls = `r-${result.regime.regime}`;
    rb.innerHTML = `<div class="regime-badge ${rCls}"><div class="regime-dot"></div>${result.regime.label}</div>`;

    // 星系投票
    const eg = document.getElementById('ensembleGrid');
    eg.innerHTML = '';
    const sortedEns = Object.entries(result.strategies).sort((a, b) => result.stratPerf[b[0]] - result.stratPerf[a[0]]);
    sortedEns.forEach(([name, info]) => {
        const perf = result.stratPerf[name];
        const perfPct = (perf * 100).toFixed(0);
        const isKill = info.kill === result.killGroup;
        eg.innerHTML += `
            <div class="ens-item">
                <div>
                    <div class="ens-name">${name}</div>
                    <div style="font-size:10px; color:var(--text-4); margin-top:2px;">近期 ${perfPct}%</div>
                </div>
                <div class="ens-vote ${isKill ? 'kill' : 'keep'}">${info.kill}</div>
            </div>
        `;
    });

    // 因子权重
    const fg = document.getElementById('factorsGrid');
    fg.innerHTML = '';
    const sortedFactors = Object.entries(result.dynWeights).sort((a, b) => b[1] - a[1]);
    const colors = ['#0A84FF', '#BF5AF2', '#30D158', '#FF9F0A', '#64D2FF', '#FF375F', '#5E5CE6', '#FFD60A', '#32ADE6', '#FF453A', '#40C8E0', '#FF6482'];
    sortedFactors.forEach(([name, w], i) => {
        const hr = result.factorHitRates[name];
        const pct = (w * 100).toFixed(1);
        const hrPct = (hr * 100).toFixed(0);
        const color = colors[i % colors.length];
        fg.innerHTML += `
            <div class="factor-item">
                <div class="f-name">${name}</div>
                <div class="f-track">
                    <div class="f-fill" style="width:${pct}%; background:${color}; color:${color};"></div>
                </div>
                <div class="f-pct">${pct}%</div>
                <div class="f-hr">${hrPct}%</div>
            </div>
        `;
    });

    // 策略表现
    const sl = document.getElementById('stratList');
    sl.innerHTML = '';
    const sortedStrats = Object.entries(result.stratPerf).sort((a, b) => b[1] - a[1]);
    const stratColors = ['#30D158', '#0A84FF', '#BF5AF2', '#FF9F0A', '#64D2FF', '#FF375F', '#5E5CE6'];
    sortedStrats.forEach(([name, rate], i) => {
        const isBest = name === result.bestStrat;
        const ratePct = (rate * 100).toFixed(0);
        const color = stratColors[i % stratColors.length];
        sl.innerHTML += `
            <div class="strat-row ${isBest ? 'best' : ''}">
                <span class="strat-name">${name}</span>
                <span class="strat-rate">
                    ${ratePct}%
                    <div class="strat-bar"><div class="strat-bar-fill" style="width:${ratePct}%; background:${color};"></div></div>
                    ${isBest ? '⭐' : ''}
                </span>
            </div>
        `;
    });

    // 滚动到结果
    setTimeout(() => {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);
}

function loadDemo() {
    // 生成示例数据（带轨道转移+引力偏移模式）
    const trans = {
        '小单': { '小双': 0.32, '大单': 0.28, '大双': 0.22, '小单': 0.18 },
        '小双': { '大单': 0.30, '大双': 0.25, '小单': 0.28, '小双': 0.17 },
        '大单': { '大双': 0.33, '小单': 0.27, '小双': 0.22, '大单': 0.18 },
        '大双': { '小单': 0.30, '小双': 0.28, '大单': 0.24, '大双': 0.18 },
    };
    let cur = '小单';
    const lines = [];
    for (let i = 0; i < 60; i++) {
        const r = Math.random();
        let cum = 0;
        for (const [combo, p] of Object.entries(trans[cur])) {
            cum += p;
            if (r < cum) { cur = combo; break; }
        }
        const total = cur.startsWith('小') ? Math.floor(Math.random() * 14) : 14 + Math.floor(Math.random() * 14);
        const t = Math.max(3, total);
        const n1 = Math.floor(Math.random() * 10);
        const n2 = Math.floor(Math.random() * 10);
        const n3 = Math.max(0, Math.min(9, t - n1 - n2));
        const nums = [n1, n2, n3];
        for (let j = nums.length - 1; j > 0; j--) {
            const k = Math.floor(Math.random() * (j + 1));
            [nums[j], nums[k]] = [nums[k], nums[j]];
        }
        lines.push(nums.join(' '));
    }
    document.getElementById('input').value = lines.join('\n');
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('loaderCard').style.display = 'none';
}

// 快捷键
document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') runPredict();
});
