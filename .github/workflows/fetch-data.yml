name: Orbit数据自动刷新

on:
  schedule:
    # 每5分钟抓取一次（GitHub Actions cron 最小粒度5分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 需要写权限来提交数据文件

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取最新数据
        run: python scripts/fetch_data.py

      - name: 提交数据
        run: |
          git config user.name "Orbit Bot"
          git config user.email "bot@orbit-engine.local"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "auto: 刷新开奖数据 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
